# for local dev
# Host ports / project name come from .env (see .env.example).
# No container_name — Compose namespaces by project so worktrees don't clash.
services:
  mysql:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: secret-mysql-password
      MYSQL_DATABASE: wso
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - wso_mysql_data:/var/lib/mysql
    healthcheck:
      # Password must match MYSQL_ROOT_PASSWORD in config/secrets.yaml
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-psecret-mysql-password"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - wso_redis_data:/data
      - ./lib/redis_util/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--save", "300", "1", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  wso_mysql_data:
  wso_redis_data:

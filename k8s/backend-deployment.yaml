apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  selector:
    matchLabels:
      tier: backend
  replicas: 1 # tells deployment to run X pods matching the template
  template:
    metadata:
      labels:
        tier: backend
    spec:
      containers:
        - name: wso-go
          image: wso-backend:dev-latest
          args: ["--config=/config/local-k8-development.yaml"]
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - mountPath: "/etc/config-secrets"
              name: config-secret
              readOnly: true
      volumes:
        - name: config-secret
          secret:
            secretName: backend-config-secrets
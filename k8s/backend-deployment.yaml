apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  selector:
    matchLabels:
      tier: backend
  replicas: 1 # tells deployment to run X pods matching the template
  template:
    metadata:
      labels:
        tier: backend
    spec:
      containers:
        - name: wso-go
          image: wso-backend:dev-latest
          args: ["--env=local-k8-development"]
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
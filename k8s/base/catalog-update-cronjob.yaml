apiVersion: batch/v1beta1
kind: CronJob
metadata:
  name: wso-cronjob-catalog-update
spec:
  schedule: "0 3 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: wso-cronjob-catalog-update
              image: wso-backend-jobs:latest
              command: [/wso-jobs/catalog-update]
              args: []
              env:
                - name: WSO_SECRET_MYSQL_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: mysql-secrets
                      key: MYSQL_PASSWORD
              volumeMounts:
                - mountPath: "/etc/config-secrets"
                  name: config-secret
                  readOnly: true
                - mountPath: "/etc/configs"
                  name: config
                  readOnly: true
          volumes:
            - name: config-secret
              secret:
                secretName: backend-config-secrets
            - name: config
              configMap:
                name: backend-config
          restartPolicy: OnFailure
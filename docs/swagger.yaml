        type: array
      id:
        type: integer
      keyOrCard:
        type: string
      location:
        type: number
      loudness:
        type: integer
      modeDoubleArea:
        type: integer
      modeSingleArea:
        type: integer
      name:
        type: string
      neighborhood:
        $ref: '#/definitions/models.Neighborhood'
        type: object
      neighborhoodID:
        description: Belongs to neighborhood
        type: integer
      numberBathrooms:
        type: integer
      numberDoubles:
        type: integer
      numberFlex:
        type: integer
      numberSingles:
        type: integer
      numberWashers:
        type: integer
      satisfaction:
        type: number
      wifi:

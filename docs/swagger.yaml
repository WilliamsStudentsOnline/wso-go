        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/lib.APIError'
      security:
      - Bearer: []
      summary: Updates all users from LDAP
      tags:
      - admin
  /auth/api/refresh:
    get:
      consumes:
      - application/json
      description: issues an API JWT by taking an existing API JWT and updating the
        fields. This calls the db, so it will actually modify the token's payload.
      operationId: auth-api-update
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/lib.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/lib.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/lib.APIError'
      security:
      - Bearer: []
      summary: Refresh API Token
      tags:
      - auth
      - auth-2.0
  /auth/api/token:
    post:
      consumes:
      - application/json
      description: issues an API JWT given an identity token.
      operationId: auth-api-token
      parameters:
      - description: Identity Token
        in: query
        name: identityToken
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/lib.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/lib.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/lib.APIError'
      summary: Authenticate API Token
      tags:
      - auth
      - auth-2.0
  /auth/identity/token:
    post:
      consumes:

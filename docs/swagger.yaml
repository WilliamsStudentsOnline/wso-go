host: localhost:8080
info:
  contact:
    email: wso-dev@wso.williams.edu
    name: WSO Dev
  description: API for WSO services like factrak, facebook, dormtrak, course scheduler,
    and others.
  license: {}
  title: WSO API
  version: 0.1.0
paths:
  /admin/catalog-update:
    post:
      consumes:
      - application/json
      description: executes a kubernetes job that updates the course catalog
      operationId: catalog-update
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/admin.KubeJobReturn'
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/lib.APIError'
            type: object
      security:
      - Bearer: []
      summary: Updates the course catalog
      tags:
      - admin
  /admin/jobs/{jobID}/status:
    get:
      consumes:
      - application/json
      description: connects to Kubernetes to get the status of a running (or recently
        finished) job given an id
      operationId: get-job-status
      parameters:
      - description: Kubernetes Job ID
        in: path
        name: jobID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/k8s.io/api/batch/v1.JobStatus'
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/lib.APIError'
            type: object
      security:
      - Bearer: []
      summary: Gets status of a job
      tags:
      - admin
  /admin/update-all-factrak-survey-deficits:
    post:
      consumes:
      - application/json
      description: runs a slow job that updates all student factrak survey deficits
      operationId: update-all-factrak-survey-deficits
      produces:
      - application/json
      responses:
        "200":
          description: Job completed
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/lib.APIError'
            type: object
      security:
      - Bearer: []
      summary: Updates all factrak survey deficits
      tags:
      - admin
  /admin/update-all-users-from-ldap:
    post:
      consumes:
      - application/json
      description: runs a slow job that updates all users from LDAP
      operationId: update-all-users-from-ldap
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/admin.KubeJobReturn'
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/lib.APIError'
            type: object
      security:
      - Bearer: []
      summary: Updates all users from LDAP
      tags:
      - admin
  /auth/login:
    post:
      consumes:
      - application/json
      description: attempts to get a JWT by logging into server.
      operationId: auth-login
      parameters:
      - description: Login Parameters
        in: body
        name: loginParams
        required: true
        schema:
          $ref: '#/definitions/auth.LoginParams'
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.AuthResponse'
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/lib.APIError'
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/lib.APIError'
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/lib.APIError'
            type: object
      summary: Authenticate and Login
      tags:
      - auth
  /auth/refresh-token:
    get:
      consumes:
      - application/json
      description: attempts to get a JWT by taking an existing JWT and refreshing
        it. This will not change the payload.
      operationId: auth-refresh
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.AuthResponse'
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/lib.APIError'
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/lib.APIError'
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/lib.APIError'
            type: object
      security:
      - Bearer: []
      summary: Refresh Token
      tags:
      - auth
  /auth/update-token:
    get:
      consumes:
      - application/json
      description: attempts to get a JWT by taking an existing JWT and updating the
        fields. This calls the DB, so it will actually modify the token's payload.
      operationId: auth-update
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.AuthResponse'
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/lib.APIError'
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/lib.APIError'
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/lib.APIError'
            type: object
      security:
      - Bearer: []
      summary: Update Token
      tags:
      - auth
  /dormtrak/dorms:
    get:
      consumes:
      - application/json
      description: lists all dorms
      operationId: dormtrak-list-dorms
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Dorm'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/lib.APIError'
            type: object
      security:
      - Bearer: []
      summary: List dorms
      tags:
      - dormtrak
  /dormtrak/dorms/{dormID}:
    get:
      consumes:
      - application/json
      description: gets one dorm with neighborhood and dorm rooms preloaded
      operationId: dormtrak-get-dorm
      parameters:
      - description: Dorm ID
        in: path
        name: dormID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Dorm'
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/lib.APIError'
            type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/lib.APIError'
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/lib.APIError'
            type: object
      security:
      - Bearer: []
      summary: Get dorm
      tags:
      - dormtrak
  /dormtrak/dorms/{dormID}/facts:
    get:
      consumes:
      - application/json
      description: gets dorm facts of one dorm building. Some of these facts are in
        GetDorm, while others are generated here.
      operationId: dormtrak-get-dorm-facts
      parameters:
      - description: Dorm ID
        in: path
        name: dormID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.DormFacts'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/lib.APIError'
            type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/lib.APIError'
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/lib.APIError'
            type: object
      security:
      - Bearer: []
      summary: Get dorm facts
      tags:
      - dormtrak
  /dormtrak/dorms/{dormID}/rooms:
    get:
      consumes:
      - application/json
      description: gets dorm rooms of one dorm building

      gradeReceived:
        type: string
      id:
        type: integer
      leadLecture:
        type: integer
      outsideHelpfulness:
        type: integer
      professor:
        $ref: '#/definitions/models.User'
        type: object
      professorID:
        description: Belongs to professor
        type: integer
      promoteDiscussion:
        type: integer
      totalAgree:
        description: Not looked at by GORM, just for returning in JSON
        type: integer
      totalDisagree:
        type: integer
      user:
        $ref: '#/definitions/models.User'
        type: object
      userID:
        description: Belongs to user (student)
        type: integer
      wouldRecommendCourse:
        type: boolean
      wouldTakeAnother:
        type: boolean
    type: object
  models.FactrakSurveyAvgRatings:
    properties:
      avgApproachability:
        type: number
      avgCourseStimulating:
        type: number
      avgCourseWorkload:
        type: number
      avgLeadLecture:
        type: number
      avgOutsideHelpfulness:
        type: number
      avgPromoteDiscussion:
        type: number
      avgWouldRecommendCourse:
        type: number
      avgWouldTakeAnother:
        type: number
      numApproachability:
        type: integer
      numCourseStimulating:
        type: integer
      numCourseWorkload:

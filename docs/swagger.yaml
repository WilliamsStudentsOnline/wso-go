  user.UpdateUserParams:
    properties:
      dormVisible:
        type: boolean
      hasAcceptedDormtrakPolicy:
        type: boolean
      hasAcceptedFactrakPolicy:
        type: boolean
      homeVisible:
        type: boolean
      offCycle:
        type: boolean
      pronoun:

basePath: /api/v1
definitions:
  admin.KubeJobReturn:
    properties:
      jobID:
        type: string
    type: object
  auth.AuthResponse:
    properties:
      expire:
        type: string
      token:
        type: string
    type: object
  auth.LoginParams:
    properties:
      localIP:
        description: If true, will authenticate based on IP. Fail if cannot get on-campus
          token.
        type: boolean
      password:
        type: string
      unixID:
        type: string
      useIP:
        description: If true, will authenticate based on IP. Will return either off-campus
          or on-campus token
        type: boolean
    required:
    - password
    - unixID
    type: object
  factrak.AgreementCreateParams:
    properties:
      agree:
        type: boolean
    type: object
  factrak.AgreementUpdateParams:
    properties:
      agree:
        type: boolean
    type: object
  factrak.SurveyCreateParams:
    properties:
      approachability:
        type: integer
      areaOfStudyAbbreviation:
        description: 'Or this:'
        type: string
      comment:
        description: 'Params:'
        type: string
      courseID:
        description: 'Must include either this:'
        type: integer
      courseNumber:
        description: Like "256"
        type: string
      courseStimulating:
        type: integer
      courseWorkload:
        type: integer
      gradeReceived:
        type: string
      leadLecture:
        type: integer
      outsideHelpfulness:
        type: integer
      professorID:
        description: 'Must include this:'
        type: integer
      promoteDiscussion:
        type: integer
      wouldRecommendCourse:
        type: boolean
      wouldTakeAnother:
        type: boolean
    required:
    - comment
    - professorID
    type: object
  factrak.SurveyUpdateParams:
    properties:
      approachability:
        type: integer
      comment:
        description: 'Params:'
        type: string
      courseStimulating:
        type: integer
      courseWorkload:
        type: integer
      gradeReceived:
        type: string
      leadLecture:
        type: integer
      outsideHelpfulness:
        type: integer
      promoteDiscussion:
        type: integer
      wouldRecommendCourse:
        type: boolean
      wouldTakeAnother:
        type: boolean
    type: object
  lib.APIError:
    properties:
      code:
        type: integer
      errors:
        items:
          type: error
        type: array
      httpcode:
        type: integer
      message:
        type: string
    type: object
  models.AreaOfStudy:
    properties:
      abbreviation:
        type: string
      courses:
        description: Has many courses
        items:
          $ref: '#/definitions/models.Course'
        type: array
      department:
        $ref: '#/definitions/models.Department'
        type: object
      departmentID:
        description: Belongs to department
        type: integer
      id:
        type: integer
      name:
        type: string
    type: object
  models.Course:
    properties:
      areaOfStudy:
        $ref: '#/definitions/models.AreaOfStudy'
        type: object
      areaOfStudyID:
        description: Belongs to area of study
        type: integer
      factrakSurveys:
        description: Has many factrak surveys
        items:
          $ref: '#/definitions/models.FactrakSurvey'
        type: array
      id:
        type: integer
      number:
        type: string
      professors:
        description: Has many professors (thru factrak surveys). Ignore this in Gorm.

        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/lib.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/lib.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/lib.APIError'
      summary: Authenticate Identity Token
      tags:
      - auth
      - auth-2.0
  /auth/login:
    post:
      consumes:
      - application/json
      description: attempts to get a JWT by logging into server.
      operationId: auth-login
      parameters:
      - description: Login Parameters
        in: body
        name: loginParams
        required: true
        schema:
          $ref: '#/definitions/old.LoginParams'
          type: object
      produces:

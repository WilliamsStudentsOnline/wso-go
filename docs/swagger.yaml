    type: object
  models.Tag:
    properties:
      id:
        type: integer
      name:
        type: string
      users:
        items:
          $ref: '#/definitions/models.User'
        type: array
    type: object
  models.User:
    properties:
      admin:
        type: boolean
      atWilliams:
        type: boolean
      campusPhoneEXT:

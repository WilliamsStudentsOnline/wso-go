  models.FactrakSurvey:
    properties:
      agreements:
        description: Has many agreements
        items:
          $ref: '#/definitions/models.FactrakAgreement'
        type: array
      approachability:
        type: integer
      comment:
        type: string
      course:
        $ref: '#/definitions/models.Course'
        type: object
      courseID:
        description: Belongs to course
        type: integer
      courseStimulating:
        type: integer
      courseWorkload:
        type: integer
      createdTime:
        description: 'Pass the created time: not looked at by GORM'
        type: string
      flagged:

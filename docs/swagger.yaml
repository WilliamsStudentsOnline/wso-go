  /bulletin/bulletins:
    get:
      consumes:
      - application/json
      description: lists all bulletins
      operationId: bulletins-list-bulletins
      parameters:
      - description: Start Pagination (timestamp)
        in: query
        name: start
        type: string
      - description: Offset Pagination
        in: query
        name: offset
        type: integer
      - description: Limit Pagination
        in: query
        name: limit
        type: integer
      - description: Preload List
        in: query
        items:
          type: string
        name: preload
        type: array
      - description: Bulletin Type
        in: query
        name: type
        type: string
      - description: Get All Bulletins (no restriction on startDate, endDate)
        in: query
        name: all
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Bulletin'
            type: array
        "500":
          description: Internal Server Error

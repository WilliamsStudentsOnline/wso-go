host: wso.williams.edu
info:
  contact:
    email: wso-dev@wso.williams.edu
    name: WSO Dev
  description: API for WSO services like factrak, facebook, dormtrak, course scheduler,
    and others.
  title: WSO API
  version: 2.0.0
paths:
  /auth/api/refresh:
    get:
      consumes:
      - application/json
      description: issues an API JWT by taking an existing API JWT and updating the
        fields. This calls the db, so it will actually modify the token's payload.
      operationId: auth-api-update
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/services.BaseErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/services.BaseErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/services.BaseErrorResponse'
      security:
      - Bearer: []
      summary: Refresh API Token
      tags:
      - auth
      - auth-2.0
  /auth/api/token:
    post:
      consumes:
      - application/json
      description: issues an API JWT given an identity token.
      operationId: auth-api-token
      parameters:
      - description: Identity Token
        in: query
        name: identityToken
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/services.BaseErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/services.BaseErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/services.BaseErrorResponse'
      summary: Authenticate API Token
      tags:
      - auth
      - auth-2.0
  /auth/identity/token:
    post:
      consumes:
      - application/json
      description: issues an Identity JWT given identity credentials.
      operationId: auth-identity-token
      parameters:
      - description: Identity Credentials
        in: body
        name: identityCredentials
        required: true
        schema:
          $ref: '#/definitions/identity.Credentials'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/services.BaseErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/services.BaseErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/services.BaseErrorResponse'
      summary: Authenticate Identity Token
      tags:
      - auth
      - auth-2.0
  /auth/login:
    post:
      consumes:
      - application/json
      description: attempts to get a JWT by logging into server.
      operationId: auth-login
      parameters:
      - description: Login Parameters
        in: body
        name: loginParams
        required: true
        schema:
          $ref: '#/definitions/old.LoginParams'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/old.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/services.BaseErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/services.BaseErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/services.BaseErrorResponse'
      summary: Authenticate and Login
      tags:
      - auth
  /auth/refresh-token:
    get:
      consumes:
      - application/json
      description: attempts to get a JWT by taking an existing JWT and refreshing
        it. This will not change the payload.
      operationId: auth-refresh
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/old.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/services.BaseErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/services.BaseErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/services.BaseErrorResponse'
      security:
      - Bearer: []
      summary: Refresh Token
      tags:
      - auth
  /auth/update-token:

        type: array
      minMeanSingleSize:
        items:
          $ref: '#/definitions/models.Dorm'
        type: array
      mostBathrooms:
        items:
          $ref: '#/definitions/models.Dorm'
        type: array
      mostDoubles:
        items:
          $ref: '#/definitions/models.Dorm'
        type: array
      mostSingles:
        items:
          $ref: '#/definitions/models.Dorm'
        type: array
      smallestDoubles:
        items:
          $ref: '#/definitions/models.DormRoom'
        type: array
      smallestSingles:
        items:
          $ref: '#/definitions/models.DormRoom'
        type: array

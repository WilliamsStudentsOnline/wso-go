# Directories for job run logs and uploaded inputs.
# Install:
#   sudo cp prod_files/tmpfiles.d/wso-jobs.conf /etc/tmpfiles.d/wso-jobs.conf
#   sudo systemd-tmpfiles --create /etc/tmpfiles.d/wso-jobs.conf
d /var/log/wso-jobs 0750 wso wso -
d /var/lib/wso-jobs 0750 wso wso -
d /var/lib/wso-jobs/inputs 0700 wso wso -

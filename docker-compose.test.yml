# local dev tests only
# but still torn down by `make dev-down`/`make dev-reset`
# Project name is <COMPOSE_PROJECT_NAME>-test (see scripts/devenv.sh / Makefile).
services:
  mysql:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: secret-mysql-password
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "${TEST_MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - wso_mysql_test_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

volumes:
  wso_mysql_test_data:

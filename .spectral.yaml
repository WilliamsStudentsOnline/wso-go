# OpenAPI lint rules for docs/swagger.yaml (generated by swag)
extends:
  - [spectral:oas, recommended]

rules:
  # WSO documents custom API error codes (1100, 1331, etc) as response keys.
  # That is invalid OAS2 but widespread in swag annotations; keep as warn until cleaned up.
  oas2-schema: warn
  oas2-api-schemes: warn
  operation-tag-defined: off
  operation-tags: warn

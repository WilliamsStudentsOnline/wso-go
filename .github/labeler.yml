# Auto-label PRs based on changed files.
# See https://github.com/actions/labeler

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - go.mod
          - go.sum

codegen:
  - changed-files:
      - any-glob-to-any-file:
          - db/atlas/schema.sql
          - db/atlas/migrations/**
          - docs/docs.go
          - docs/swagger.json
          - docs/swagger.yaml
          - .github/scripts/publish-api.sh
          - .github/workflows/openapi-release.yml
          - .spectral.yaml
          - .github/scripts/check-openapi.sh
          - .github/workflows/openapi.yml

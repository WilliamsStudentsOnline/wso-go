name: OpenAPI
on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  merge_group:

env:
  GO111MODULE: on

jobs:
  openapi:
    name: Swag / Spectral / oasdiff
    # Re-run when allow-breaking-changes is added/removed; ignore other label events
    if: >
      github.event_name != 'pull_request' ||
      (github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
      github.event.label.name == 'allow-breaking-changes'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          cache-dependency-path: "**/*.sum"

      - name: Add Go bin to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install swag
        run: go install github.com/swaggo/swag/cmd/swag@v1.16.3

      - name: Install goimports
        run: go install golang.org/x/tools/cmd/goimports@v0.49.0

      - name: Install oasdiff
        # Pin: newer oasdiff releases need a newer Go than go.mod
        run: go install github.com/tufin/oasdiff@v1.10.8

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install Spectral
        run: npm install -g @stoplight/spectral-cli@6.16.3

      - name: Resolve OpenAPI base ref
        id: base
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "ref=origin/${{ github.base_ref }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "merge_group" ]]; then
            echo "ref=origin/master" >> "$GITHUB_OUTPUT"
          else
            # push to master: compare against previous commit's committed swagger
            echo "ref=HEAD^" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve allow-breaking-changes label
        id: breaking
        env:
          GH_TOKEN: ${{ github.token }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          MERGE_GROUP_REF: ${{ github.event.merge_group.head_ref }}
        run: |
          set -euo pipefail
          labels="$PR_LABELS"
          if [[ "${{ github.event_name }}" == "merge_group" ]]; then
            # merge_group events carry no pull_request payload; the PR number is in
            # head_ref (gh-readonly-queue/<base>/pr-<number>-<sha>)
            pr="$(sed -nE 's#.*/pr-([0-9]+)-.*#\1#p' <<<"$MERGE_GROUP_REF")"
            labels="$(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json labels --jq '[.labels[].name] | join(",")')"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            # push to master: use the labels of the PR(s) that produced this commit
            labels="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '[.[].labels[].name] | join(",")')"
          fi
          if [[ ",$labels," == *",allow-breaking-changes,"* ]]; then
            echo "allow=true" >> "$GITHUB_OUTPUT"
          else
            echo "allow=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check OpenAPI
        id: openapi
        continue-on-error: true
        env:
          OPENAPI_BASE_REF: ${{ steps.base.outputs.ref }}
          # true when the PR (looked up from head_ref in the merge queue) has the allow-breaking-changes label
          ALLOW_BREAKING_CHANGES: ${{ steps.breaking.outputs.allow }}
        run: make check-api

      - name: OpenAPI summary
        if: always()
        run: |
          if [[ -f openapi-comment.md ]]; then
            cat openapi-comment.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Add OpenAPI PR Comment
        uses: marocchino/sticky-pull-request-comment@v3
        continue-on-error: true
        if: >
          always() &&
          github.event_name == 'pull_request' &&
          hashFiles('openapi-comment.md') != ''
        with:
          header: openapi
          path: openapi-comment.md

      - name: Remove OpenAPI PR Comment
        uses: marocchino/sticky-pull-request-comment@v3
        continue-on-error: true
        if: >
          always() &&
          github.event_name == 'pull_request' &&
          hashFiles('openapi-comment.md') == '' &&
          hashFiles('openapi-results/comment.post') != ''
        with:
          header: openapi
          delete: true

      - name: Fail job if OpenAPI checks failed
        if: always() && steps.openapi.outcome != 'success'
        run: exit 1

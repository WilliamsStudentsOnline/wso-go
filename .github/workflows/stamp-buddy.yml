name: stamp-buddy

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  approve:
    if: >
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check allowlist
        run: grep -qxF "${{ github.event.pull_request.user.login }}" .github/stamp-buddy-allowlist.txt

      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.STAMP_BUDDY_APP_ID }}
          private-key: ${{ secrets.STAMP_BUDDY_PRIVATE_KEY }}

      - uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              event: 'APPROVE',
              body: 'Approved by stamp-buddy (allowlisted author).',
            });

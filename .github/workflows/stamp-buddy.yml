name: stamp-buddy

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  approve:
    if: >
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '@stamp-buddy')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check allowlist
        env:
          COMMENTER: ${{ github.event.comment.user.login }}
        run: grep -qxF "$COMMENTER" .github/stamp-buddy-allowlist.txt

      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.STAMP_BUDDY_APP_ID }}
          private-key: ${{ secrets.STAMP_BUDDY_PRIVATE_KEY }}

      - uses: actions/github-script@v7
        env:
          PR_URL: ${{ github.event.issue.pull_request.url }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { data: pr } = await github.request(process.env.PR_URL);
            if (pr.draft) {
              core.setFailed('PR is still a draft.');
              return;
            }
            if (pr.head.repo.full_name !== pr.base.repo.full_name) {
              core.setFailed('Refusing to approve a fork PR.');
              return;
            }
            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              event: 'APPROVE',
              body: `Approved by stamp-buddy (requested by @${context.payload.comment.user.login}).`,
            });

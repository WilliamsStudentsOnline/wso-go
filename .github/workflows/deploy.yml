name: Deploy
on:
  push:
    branches:
      - master
      - production

env:
  GO111MODULE: on
  GOOS: linux
  GOARCH: amd64
  PATH: /usr/local/bin:/usr/bin:/bin

jobs:
  deploy-dev:
    name: Deploy to development
    if: github.ref == 'refs/heads/master'
    runs-on: [self-hosted, dev]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v4
        with:
          go-version-file: 'go.mod'
          cache: false
      - name: Build Server
        run: make build-prod-linux
      - name: Build Jobs
        run: make build-jobs-prod-linux
      # TODO: deploy config files alongside WSO-Go.
      - name: Install binaries
        run: |
          set -euo pipefail
          mkdir -p /opt/wso-go

          install_bin() {
            local src="$1" dst="$2"
            cp "$src" "${dst}.new"
            chmod +x "${dst}.new"
            mv "${dst}.new" "$dst"
          }

          install_bin wso-backend_linux /opt/wso-go/wso-backend_linux
          install_bin wso-jobctl_linux /opt/wso-go/wso-jobctl_linux
          for f in job-*_linux; do
            install_bin "$f" "/opt/wso-go/$f"
          done

          sudo systemctl restart WSO-Go
          sudo systemctl try-restart WSO-Mobile || true
      - name: Sync job systemd units
        run: |
          set -euo pipefail

          mapfile -t old_timers < <(
            systemctl list-unit-files 'wso-job-*.timer' --no-legend 2>/dev/null \
              | awk '{print $1}' || true
          )

          sudo /opt/wso-go/wso-jobctl_linux gen-units -out /etc/systemd/system
          sudo systemctl daemon-reload

          shopt -s nullglob
          for timer in /etc/systemd/system/wso-job-*.timer; do
            sudo systemctl enable --now "$(basename "$timer")"
          done

          for t in "${old_timers[@]+"${old_timers[@]}"}"; do
            if [ ! -f "/etc/systemd/system/$t" ]; then
              sudo systemctl disable --now "$t" 2>/dev/null || true
              sudo systemctl reset-failed "$t" 2>/dev/null || true
            fi
          done

  deploy-prod:
    name: Deploy to production
    if: github.ref == 'refs/heads/production'
    runs-on: [self-hosted, prod]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v4
        with:
          go-version-file: 'go.mod'
          cache: false
      - name: Build Server
        run: make build-prod-linux
      - name: Build Jobs
        run: make build-jobs-prod-linux
      # TODO: deploy config files alongside WSO-Go.
      - name: Install binaries
        run: |
          set -euo pipefail
          mkdir -p /opt/wso-go

          install_bin() {
            local src="$1" dst="$2"
            cp "$src" "${dst}.new"
            chmod +x "${dst}.new"
            mv "${dst}.new" "$dst"
          }

          install_bin wso-backend_linux /opt/wso-go/wso-backend_linux
          install_bin wso-jobctl_linux /opt/wso-go/wso-jobctl_linux
          for f in job-*_linux; do
            install_bin "$f" "/opt/wso-go/$f"
          done

          sudo systemctl restart WSO-Go
          sudo systemctl try-restart WSO-Mobile || true
      - name: Sync job systemd units
        run: |
          set -euo pipefail

          mapfile -t old_timers < <(
            systemctl list-unit-files 'wso-job-*.timer' --no-legend 2>/dev/null \
              | awk '{print $1}' || true
          )

          sudo /opt/wso-go/wso-jobctl_linux gen-units -out /etc/systemd/system
          sudo systemctl daemon-reload

          shopt -s nullglob
          for timer in /etc/systemd/system/wso-job-*.timer; do
            sudo systemctl enable --now "$(basename "$timer")"
          done

          for t in "${old_timers[@]+"${old_timers[@]}"}"; do
            if [ ! -f "/etc/systemd/system/$t" ]; then
              sudo systemctl disable --now "$t" 2>/dev/null || true
              sudo systemctl reset-failed "$t" 2>/dev/null || true
            fi
          done
      - name: Health check
        run: |
          set -euo pipefail
          curl -fsS --retry 5 --retry-delay 2 \
            https://wso.williams.edu/api/v2/health-check \
            | tee /tmp/health.json
          python3 -c 'import json,sys; assert json.load(open("/tmp/health.json")).get("ok") is True'

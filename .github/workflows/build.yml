name: CI/CD Build and Test
on:
  push:
    branches:
      - '**' # matches every branch
      - '!master' # excludes master (handled by Jenkins, we should rename to main sometime)
      - '!main' # excludes master (handled by Jenkins)
      - '!production' # excludes production (handled by Jenkins)
  pull_request:

env:
  GO111MODULE: on
  CGO_ENABLED: 1 # go-sqlite3 requires cgo (only used in tests)
  GOOS: linux
  GOARCH: amd64

jobs:
  lint:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v4
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: "**/*.sum"
      - run: go version

      - name: Install Dependencies
        run: go get -v -t ./...

      # Note that Makefile temporarily sets CGO_ENABLED=0 for building
      - name: Build Server
        run: make build-prod-linux
      - name: Build Jobs
        run: make build-jobs-prod-linux

      - name: Set up test environment
        run: |
          go install github.com/gotesttools/gotestfmt/v2/cmd/gotestfmt@latest
          go install github.com/t-yuki/gocover-cobertura@latest
      - name: Run tests
        run: |
          set -euo pipefail
          go test -race -json -v -coverprofile=coverage.txt ./... 2>&1 | tee /tmp/gotest.log | gotestfmt -hide=successful-tests,empty-packages

      # Disabled for now, due to the giant size (and not being used)
      # - name: Upload test log
      #   uses: actions/upload-artifact@v2
      #   if: always()
      #   with:
      #     name: test-log
      #     path: /tmp/gotest.log
      #     if-no-files-found: error

      # Add coverage report to PRs
      - name: Convert go coverage to corbetura format
        run: gocover-cobertura < coverage.txt > coverage.xml
      - name: Coverage Summary Report
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coverage.xml
          badge: true
          format: markdown
          hide_branch_rate: false
          hide_complexity: false
          indicators: false
          output: both
      - name: Add Coverage PR Comment
        uses: marocchino/sticky-pull-request-comment@v2
        if: github.event_name == 'pull_request'
        with:
          recreate: true
          path: code-coverage-results.md

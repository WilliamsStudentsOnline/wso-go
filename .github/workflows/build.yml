name: CI/CD Build and Test
on:
  push:
    branches:
      - master
  pull_request:
  merge_group:

env:
  GO111MODULE: on
  CGO_ENABLED: 1 # go-sqlite3 requires cgo (only used in tests)
  GOOS: linux
  GOARCH: amd64

jobs:
  lint:
    name: Build and Test
    runs-on: ubuntu-latest
    permissions: write-all # fix PR comment failure
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v4
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: "**/*.sum"
      - run: go version

      - name: Install Dependencies
        run: go get -v -t ./...

      # Note that Makefile temporarily sets CGO_ENABLED=0 for building
      - name: Build Server
        run: make build-prod-linux
      - name: Build Jobs
        run: make build-jobs-prod-linux

      # Build Redis container for tests
      - name: Build Redis Docker Image
        run: docker build -t wso-redis -f lib/redis_util/Redis.Dockerfile lib/redis_util/

      # Run Redis container
      - name: Run Redis Container
        run: |
          docker run -d \
            --name wso-redis-tests \
            -p 6379:6379 \
            wso-redis

      - name: Set up test environment
        run: |
          go install gotest.tools/gotestsum@latest
          go install github.com/t-yuki/gocover-cobertura@latest
      - name: Run tests
        run: |
          set -euo pipefail
          # Path prefixes from .github/coverage-exclude.txt (recursive)
          exclude="$(awk '/^[^#[:space:]]/ { print $1 }' .github/coverage-exclude.txt | paste -sd'|' -)"
          mapfile -t packages < <(go list ./... | grep -Ev "/(${exclude})(/|$)")
          # One line per package; only expand failed test output. Full JSON kept for summaries.
          gotestsum \
            --format=pkgname-and-test-fails \
            --format-hide-empty-pkg \
            --hide-summary=skipped \
            --jsonfile=/tmp/gotest.log \
            -- \
            -race -coverprofile=coverage.txt "${packages[@]}"
      - name: Summarize test failures
        if: failure()
        run: python3 .github/scripts/summarize-test-failures.py /tmp/gotest.log >> "$GITHUB_STEP_SUMMARY"

      # Add coverage report to PRs
      - name: Convert go coverage to corbetura format
        run: gocover-cobertura < coverage.txt > coverage.xml
      - name: Coverage Summary Report
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coverage.xml
          badge: true
          format: markdown
          hide_branch_rate: false
          hide_complexity: true
          indicators: false
          output: both
      - name: Add Coverage PR Comment
        uses: marocchino/sticky-pull-request-comment@v2
        if: github.event_name == 'pull_request'
        with:
          header: coverage
          path: code-coverage-results.md

      # Kill Redis containers
      - name: Stop Redis Container
        if: always()
        run: docker stop wso-redis-tests
      - name: Remove Redis Container
        if: always()
        run: docker rm wso-redis-tests

name: CI/CD Build and Test
on:
  push:
    branches:
      - master
  pull_request:
  merge_group:

env:
  GO111MODULE: on
  # Builds force CGO_ENABLED=0 in the Makefile; tests leave cgo on for -race
  GOOS: linux
  GOARCH: amd64
  PATH: /usr/local/bin:/usr/bin:/bin
  WSO_TEST_MYSQL_HOST: 127.0.0.1
  WSO_TEST_MYSQL_PORT: "3307"
  WSO_TEST_MYSQL_USER: root
  WSO_TEST_MYSQL_PASSWORD: secret-mysql-password

jobs:
  lint:
    name: Build and Test
    # only self-host CI when merging into prod
    runs-on: ${{ github.event_name == 'pull_request' && github.base_ref == 'production' && fromJSON('["self-hosted", "prod"]') || 'ubuntu-latest' }}
    permissions: write-all # fix PR comment failure
    steps:
      - uses: actions/checkout@v7
        with:
          # Needed so coverage comment can diff against the PR base
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          # don't cache on self-hosted runners
          cache: ${{ github.event_name != 'pull_request' || github.base_ref != 'production' }}
      - run: go version
      - name: Add Go bin to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install Dependencies
        run: go get -v -t ./...

      # Note that Makefile temporarily sets CGO_ENABLED=0 for building
      - name: Build Server
        run: make build-prod-linux
      - name: Build Jobs
        run: make build-jobs-prod-linux

      # Build Redis container for tests
      - name: Build Redis Docker Image
        run: docker build -t wso-redis -f lib/redis_util/Redis.Dockerfile lib/redis_util/

      # Run Redis container
      - name: Run Redis Container
        run: |
          docker run -d \
            --name "wso-redis-tests-${{ github.run_id }}" \
            -p 6379:6379 \
            wso-redis

      - name: Start test MariaDB
        run: docker compose -p wso-test -f docker-compose.test.yml up -d --wait

      - name: Set up test environment
        run: |
          go install gotest.tools/gotestsum@latest
          go install github.com/t-yuki/gocover-cobertura@latest
      - name: Run tests
        id: tests
        continue-on-error: true
        run: |
          set -euo pipefail
          # Path prefixes from .github/coverage-exclude.txt (recursive)
          exclude="$(awk '/^[^#[:space:]]/ { print $1 }' .github/coverage-exclude.txt | paste -sd'|' -)"
          mapfile -t packages < <(go list ./... | grep -Ev "/(${exclude})(/|$)")
          gotestsum \
            --format=pkgname-and-test-fails \
            --format-hide-empty-pkg \
            --hide-summary=skipped,output \
            --jsonfile=/tmp/gotest.log \
            -- \
            -race -coverprofile=coverage.txt "${packages[@]}"

      - name: Write test results
        if: always()
        run: |
          set -euo pipefail
          if [[ "${{ steps.tests.outcome }}" == "success" ]]; then
            python3 .github/scripts/summarize-test-failures.py --pass -o test-results.md
          else
            python3 .github/scripts/summarize-test-failures.py /tmp/gotest.log -o test-results.md
          fi
          cat test-results.md >> "$GITHUB_STEP_SUMMARY"
      - name: Add Test Results PR Comment
        uses: marocchino/sticky-pull-request-comment@v3
        if: always() && github.event_name == 'pull_request'
        with:
          header: test-results
          path: test-results.md

      # Add coverage report to PRs
      - name: Convert go coverage to corbetura format
        if: always() && hashFiles('coverage.txt') != ''
        run: gocover-cobertura < coverage.txt > coverage.xml
      - name: Coverage Summary Report
        if: always() && hashFiles('coverage.xml') != ''
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coverage.xml
          badge: true
          format: markdown
          hide_branch_rate: false
          hide_complexity: true
          indicators: false
          output: both
      - name: Format Coverage PR Comment
        if: always() && github.event_name == 'pull_request' && hashFiles('code-coverage-results.md') != ''
        run: |
          python3 .github/scripts/format-coverage-comment.py \
            -i code-coverage-results.md \
            -o code-coverage-comment.md \
            --diff-range "origin/${{ github.base_ref }}...HEAD"
      - name: Add Coverage PR Comment
        uses: marocchino/sticky-pull-request-comment@v3
        if: always() && github.event_name == 'pull_request' && hashFiles('code-coverage-comment.md') != ''
        with:
          header: coverage
          path: code-coverage-comment.md

      # Kill Redis containers
      - name: Stop Redis Container
        if: always()
        run: docker stop "wso-redis-tests-${{ github.run_id }}"
      - name: Remove Redis Container
        if: always()
        run: docker rm "wso-redis-tests-${{ github.run_id }}"

      - name: Stop test MariaDB
        if: always()
        run: |
          docker compose -p wso-test -f docker-compose.test.yml down
          docker rm -f wso-mysql-test >/dev/null 2>&1 || true

      - name: Fail job if tests failed
        if: always() && steps.tests.outcome != 'success'
        run: exit 1
